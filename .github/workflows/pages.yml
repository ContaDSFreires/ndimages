name: Publicar NDImages

on:
  push:
    branches: [main]
    paths: [ndimages-pages.zip, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ndimages-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar os arquivos públicos
        run: |
          unzip -q ndimages-pages.zip -d site
          test -f site/index.html
          test -f site/criar-colagem/index.html
          test -f site/sitemap.xml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
